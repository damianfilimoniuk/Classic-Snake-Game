<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="title">JS Snake</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/6e54585903.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="header">
      <h1 class="title">
        Snake Game <span class="span">by Damian Filimoniuk</span>
      </h1>
      <h2 class="score">
        <i class="fa-solid fa-trophy"></i>
        <p id="score-label"></p>
      </h2>
    </header>
    <main class="main">
      <canvas
        width="640"
        height="640"
        class="canvas"
        id="game-canvas"
      ></canvas>
      <h2 class="label" id="game-label"></h2>
    </main>
    <script src="script.js"></script>
  </body>
</html>
